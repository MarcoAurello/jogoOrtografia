# Cabeçalhos de proteção das páginas e arquivos do app (incluído em cada location do nginx.conf).
# A API manda os dela (helmet). "always": vão também nas respostas de erro.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
# só vale quando a página chega por HTTPS (o Traefik do Dokploy); por http, o navegador ignora
add_header Strict-Transport-Security "max-age=31536000" always;
