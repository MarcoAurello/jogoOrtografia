server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # redirecionamentos sem http://host:80 (o HTTPS fica com o Dokploy na frente)
    absolute_redirect off;

    # /ortografia sem barra vira /ortografia/ (os arquivos do jogo usam caminhos relativos)
    location = /ortografia { return 301 /ortografia/; }
    location = / { return 301 /ortografia/; }

    # página, service worker e manifesto sempre conferidos: os aparelhos pegam a versão nova
    location ~* (\.html|/service-worker\.js|/manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* /ortografia/$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # imagens quase nunca mudam: o navegador guarda por 1 dia (o service worker atualiza a cópia por trás)
    location ~* \.(png|jpe?g|webp|gif|svg)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
