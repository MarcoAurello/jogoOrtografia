server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;   # não mostra a versão do nginx

    # os cabeçalhos de proteção vão em cada bloco dos arquivos do app (seguranca.conf): no nginx, um add_header dentro
    # de um location apaga os de fora. As respostas da API (/api e a página das escolas) já vêm com os do helmet.

    # redirecionamentos sem http://host:80 (o HTTPS fica com o Dokploy na frente)
    absolute_redirect off;

    # página, service worker e manifesto sempre conferidos: os aparelhos pegam a versão nova
    location ~* (\.html|/service-worker\.js|/manifest\.json)$ {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache";
    }
    location = / {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # links antigos: /ortografia/... abre os mesmos arquivos da raiz
    location = /ortografia { return 301 /ortografia/; }
    location /ortografia/ {
        include /etc/nginx/seguranca.conf;
        alias /usr/share/nginx/html/;
        index index.html;
    }

    # gestão (React, pasta gestao/): /gestao/... abre sempre o index.html dela, e o React escolhe a tela pela rota.
    # "^~" vem antes da regra das escolas (/<escola>) e das regras de .html e imagens lá embaixo.
    location = /gestao { return 301 /gestao/; }
    location ^~ /gestao/assets/ {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";   # o nome dos arquivos muda a cada build
    }
    location ^~ /gestao/ {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /gestao/index.html;
    }

    # API (login, escolas e, nas próximas fases, turmas e partidas): /api/... → serviço api do docker-compose
    location ^~ /api/ {
        proxy_pass http://api:3333/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;   # o PDF do relatório do teste grátis vai em base64
        proxy_read_timeout 300s;   # a importação da planilha (administrador) leva alguns minutos
    }

    # página de cadastro da família (endereço fixo): /<escola>/cadastro e /cadastro/<apelido> do professor avulso.
    # É sempre o mesmo cadastro.html; ele lê o endereço e pergunta à API de quem é (vem antes da regra das escolas).
    location ~ "^/[A-Za-z0-9_-]{3,40}/cadastro/?$" {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache";
        try_files /cadastro.html =404;
    }
    location ~ "^/cadastro/[a-z0-9-]{3,60}/?$" {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache";
        try_files /cadastro.html =404;
    }

    # escolas: /escolaExemplo, /kidscare... a api devolve o app já com o nome, as cores e o logo da escola
    location ~ "^/([A-Za-z0-9_-]{3,40})/?$" {
        proxy_pass http://api:3333/pagina/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # imagens quase nunca mudam: o navegador guarda por 1 dia (o service worker atualiza a cópia por trás)
    location ~* \.(png|jpe?g|webp|gif|svg)$ {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        include /etc/nginx/seguranca.conf;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
